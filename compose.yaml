services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lepas_cot
      POSTGRES_USER: lepas_cot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lepas_cot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lepas_cot -d lepas_cot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lepas_cot_postgres: